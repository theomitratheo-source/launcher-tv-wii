plugins { id 'com.android.application' }

android {
    namespace 'com.wii.launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.wii.launcher'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug   // signé debug : suffisant pour un sideload perso
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
